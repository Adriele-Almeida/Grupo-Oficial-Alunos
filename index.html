<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acesso Liberado - O Código do Novo Digital</title>
  <meta name="description" content="Seu acesso foi liberado! Entre no grupo exclusivo agora.">

  <!-- Open Graph -->
  <meta property="og:title" content="Acesso Liberado">
  <meta property="og:description" content="Clique para entrar no grupo exclusivo">
  <meta property="og:type" content="website">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #020617;
      --bg-alt: #050b1f;
      --accent: #38bdf8;
      --accent-soft: rgba(56, 189, 248, 0.12);
      --accent-strong: #0ea5e9;
      --text: #e5e7eb;
      --muted: #9ca3af;
      --radius: 14px;
      --shadow-soft: 0 18px 60px rgba(15, 23, 42, 0.85);
      --border-subtle: rgba(148, 163, 184, 0.35);
      --font-main: system-ui, -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: var(--font-main);
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      max-width: 800px;
      width: 100%;
      margin: 0 auto;
    }

    .content-wrapper {
      background: linear-gradient(135deg, rgba(8, 16, 40, 0.4) 0%, rgba(15, 25, 50, 0.3) 100%);
      backdrop-filter: blur(24px);
      border: 1px solid var(--border-subtle);
      border-radius: 24px;
      padding: 60px 40px;
      box-shadow: var(--shadow-soft);
      text-align: center;
    }

    .label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 16px;
    }

    h1 {
      font-size: clamp(32px, 5vw, 48px);
      font-weight: 700;
      line-height: 1.1;
      color: var(--text);
      margin-bottom: 32px;
      letter-spacing: -0.02em;
    }

    .description {
      font-size: 18px;
      line-height: 1.6;
      color: var(--muted);
      margin-bottom: 48px;
      max-width: 600px;
      margin-left: auto;
      margin-right: auto;
    }

    .btn-primary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: var(--accent);
      color: #020617;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.02em;
      padding: 16px 40px;
      border-radius: 12px;
      text-decoration: none;
      text-transform: uppercase;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      border: none;
      cursor: pointer;
      box-shadow:
        0 4px 14px rgba(56, 189, 248, 0.4),
        0 0 0 0 rgba(56, 189, 248, 0.5);
    }

    .btn-primary:hover {
      background: var(--accent-strong);
      transform: translateY(-2px);
      box-shadow:
        0 8px 24px rgba(56, 189, 248, 0.5),
        0 0 0 4px rgba(56, 189, 248, 0.2);
    }

    .btn-primary:active {
      transform: translateY(0);
    }

    .whatsapp-icon {
      width: 20px;
      height: 20px;
    }

    /* Success Icon */
    .success-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 80px;
      height: 80px;
      background: linear-gradient(135deg, var(--accent), var(--accent-strong));
      border-radius: 50%;
      margin: 0 auto 32px;
      box-shadow:
        0 0 40px rgba(56, 189, 248, 0.4),
        0 4px 20px rgba(56, 189, 248, 0.3);
    }

    .success-badge svg {
      width: 40px;
      height: 40px;
      stroke: #020617;
      stroke-width: 3;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* Responsive */
    @media (max-width: 768px) {
      .content-wrapper {
        padding: 40px 24px;
      }

      .description {
        font-size: 16px;
        margin-bottom: 40px;
      }

      .btn-primary {
        width: 100%;
        padding: 18px 32px;
      }

      .success-badge {
        width: 70px;
        height: 70px;
        margin-bottom: 24px;
      }

      .success-badge svg {
        width: 35px;
        height: 35px;
      }
    }

    @media (max-width: 480px) {
      .content-wrapper {
        padding: 32px 20px;
      }

      .label {
        font-size: 10px;
      }

      .description {
        font-size: 15px;
      }
    }
  </style>
</head>
<body>
  <div class="container">

      </div>

      <div class="label">Bem-vindo</div>

      <h1>Acesso Liberado!</h1>

</body>
</html>
